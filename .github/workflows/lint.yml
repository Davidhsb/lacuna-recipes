name: lint.yml
on: 
  pull_request:
    branches: 
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

    steps:
      - name: Set up nest project
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm run test